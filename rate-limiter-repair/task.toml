[task]
name = "rate-limiter-repair"
description = "Debug a broken sliding window rate limiter that incorrectly computes throttle decisions due to bugs in token replenishment, independence detection semantics, and scheduling logic."

[task.difficulty]
level = "hard"
reasoning = "The core bug implements equality-based independence (both budgets mutually dominate = equal) instead of incomparability-based independence (neither budget dominates). Both are valid interpretations with plausible justifications. The misleading docstring provides a convincing rationale for the symmetric criterion. Additionally, the replenishment bug requires understanding merge-then-increment semantics, and the scheduling bug requires priority-based topological sort knowledge."

