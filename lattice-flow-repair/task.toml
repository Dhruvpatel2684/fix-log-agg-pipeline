difficulty_explanation = "Requires understanding the distinction between join (least upper bound / over-approximation) and meet (greatest lower bound / under-approximation) in abstract interpretation. The buggy code uses meet at branch merge points, which produces an under-approximation that looks plausible but violates the soundness requirement. The function is named 'merge_states' and its docstring describes combining incoming states without specifying the lattice direction, making the meet vs join confusion non-obvious."
solution_explanation = "Replace interval_meet with interval_join in the merge_states function. The meet (intersection) computes values common to both branches, but soundness requires the join (union) which captures all values from either branch."
verification_explanation = "Tests validate that branch merge results contain values from both paths (sound over-approximation), that nested branches propagate full ranges, and that loops with internal branches produce appropriately wide intervals."
expert_time_estimate_hours = 2.5

[task]
name = "lattice-flow-repair"
description = "Fix a soundness defect in an abstract interpretation system where the interval domain produces under-approximations at control flow merge points instead of the required sound over-approximations."

[task.difficulty]
level = "hard"
reasoning = "Requires understanding abstract interpretation soundness — specifically that branch merges require the lattice JOIN (least upper bound) for may-analysis, not the MEET (greatest lower bound). Both are valid lattice operations but serve different analysis purposes. The bug is a single conceptual confusion embedded in a 200+ line domain implementation."

[task.runtime]
entrypoint = "python3 -m runtime.run_analysis"
language = "python"
dependencies = "stdlib-only"

[task.validator]
command = "bash tests/test.sh"
description = "Runs interval analysis on four traces and validates that branch merges produce sound over-approximations."

[task.repair]
command = "bash solution/solve.sh"
description = "Patches domain.py to use interval_join instead of interval_meet at merge points, then re-runs analysis."

