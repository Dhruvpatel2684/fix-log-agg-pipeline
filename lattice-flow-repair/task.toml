difficulty_explanation = "Requires understanding product lattice theory: componentwise partial ordering vs scalar reduction, Chebyshev vs Manhattan distance metrics in multi-dimensional spaces, componentwise join vs midpoint averaging, and source-aware deduplication identity — four mathematically distinct bugs that implement valid but incorrect algorithms."
solution_explanation = "Fix 1: Replace sum-based dominance comparison with componentwise AND (product lattice partial order). Fix 2: Replace averaged midpoint join with componentwise maximum (least upper bound). Fix 3: Replace Manhattan distance (L1 sum) with Chebyshev distance (L-infinity max). Fix 4: Include source_id in the deduplication key to preserve cross-source autonomy."
verification_explanation = "Tests validate output structure, deduplication correctness (all 54 events preserved), violation count (exactly 9), exclusion of incomparable flows, Chebyshev distance values, and componentwise join labels."
expert_time_estimate_hours = 3.0

[task]
name = "lattice-flow-repair"
description = "Fix defects in a product lattice security analysis system that uses two-dimensional classification (confidentiality x integrity) with componentwise ordering, Chebyshev distance, and source-aware deduplication."

[task.difficulty]
level = "hard"
reasoning = "The task requires understanding product lattice partial orders (componentwise vs sum-based), L-infinity vs L1 distance metrics, the join operation in product lattices (componentwise max vs average), and identity semantics in deduplication — four conceptually distinct mathematical bugs."

