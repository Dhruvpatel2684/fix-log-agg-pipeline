difficulty_explanation = "Requires understanding lattice-theoretic concepts (join vs meet as least upper bound vs greatest lower bound), tracing data flow through multiple processing stages, identifying a subtle config parsing whitespace issue, recognizing incorrect section references, understanding window-based snapshot semantics, and fixing sort determinism — four independent bugs that interact to produce misleading output."
solution_explanation = "Fix 1: Strip whitespace when parsing comma-delimited department list from config. Fix 2: Read violation threshold from [analysis.strict] section instead of [analysis]. Fix 3: Replace accumulating window volumes with last-write-wins semantics. Fix 4a: Change combined_label from min (meet/infimum) to max (join/supremum). Fix 4b: Add source_id to event sort key for deterministic tiebreaking."
verification_explanation = "Tests validate output file existence, correct event counts, proper department monitoring (compliance included), violation count matching strict threshold, combined label correctness (join semantics), and window volume accuracy (last-write-wins)."
expert_time_estimate_hours = 3.0

[task]
name = "lattice-flow-repair"
description = "Fix defects in a lattice-based information flow analysis system that processes security-classified events from multiple departments, detects violations against configurable thresholds, and computes flow volumes across time windows."

[task.difficulty]
level = "hard"
reasoning = "The task requires understanding partial order theory (join vs meet), multi-file data flow tracing, config section disambiguation, and window aggregation semantics — four conceptually distinct bugs spread across three source files."

[task.runtime]
entrypoint = "python3 -m runtime.run_analysis"
language = "python"
dependencies = "stdlib-only"

[task.validator]
command = "bash tests/test.sh"
description = "Runs the analysis engine and validates output structure, event counts, violation detection correctness, combined label semantics, and volume computation accuracy."

[task.repair]
command = "bash solution/solve.sh"
description = "Patches analyzer.py, lattice.py, and loader.py to fix department parsing, config section, volume semantics, sort determinism, and lattice join computation, then re-runs the analysis."

[task.resources]
timeout = 300
cpu = 2
memory = "2GB"
disk = "1GB"
