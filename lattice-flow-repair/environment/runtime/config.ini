[lattice]
# Confidentiality dimension: ordered lowest to highest
confidentiality_levels = public,internal,confidential,secret,top_secret
# Integrity dimension: ordered lowest to highest
integrity_levels = untrusted,provisional,verified,certified,authoritative

[analysis]
# Violation detection parameters for production mode
# A flow is a violation when it crosses the dominance boundary
# by more than the allowed threshold distance
violation_distance_threshold = 2
batch_window_seconds = 180

[sources]
# Active source streams to process
active_streams = research,engineering,compliance
# Deduplication window in seconds (events within this window
# from the same entity are considered potential duplicates)
dedup_window_seconds = 60

[reporting]
output_dir = /app/runtime/output
