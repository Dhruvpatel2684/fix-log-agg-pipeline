[lattice]
# Security labels ordered from lowest to highest clearance
levels = public,internal,restricted,confidential,secret,top_secret
# Departments whose flows are monitored for classification
monitored_departments = engineering,research,operations, compliance

[analysis]
# General analysis parameters
violation_threshold = 5
batch_window_seconds = 300
max_events_per_batch = 50

[analysis.strict]
# Strict mode parameters for production audits
violation_threshold = 2
batch_window_seconds = 120
max_events_per_batch = 25

[reporting]
output_dir = /app/runtime/output
include_summary = true
include_violations = true
include_flow_matrix = true
