[analysis]
correlation_window_ms = 30000
min_confidence_threshold = 0.6
max_propagation_hops = 8
enable_transitive_closure = true
batch_size = 512

[graph]
allow_cycles = false
default_edge_weight = 1.0
reachability_cache_size = 4096
path_algorithm = dijkstra

[metrics]
precision_target = 0.85
recall_target = 0.80
f1_target = 0.82
report_format = json

[aggregation]
group_by_service = true
group_by_severity = true
merge_overlapping_windows = true
window_overlap_threshold_ms = 5000

[output]
verbose = false
include_debug_paths = false
timestamp_format = epoch_ms
