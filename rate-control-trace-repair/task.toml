difficulty_explanation = "Requires knowledge of TCP CUBIC (RFC 8312), EWMA conventions (RFC 6298), BBR pacing semantics, and network measurement methodology. Six bugs spanning bandwidth unit conversion, EWMA weight direction, CUBIC time-base, loss rate computation, pacing gain application, and multiplicative decrease factor — each requiring specific protocol expertise to identify and fix."
solution_explanation = "Fix 1: Swap EWMA alpha weights (alpha for new sample per RFC 6298). Fix 2: Convert RTT ms to seconds for bandwidth calc. Fix 3: Convert elapsed ms to seconds for CUBIC growth. Fix 4: Use (lost+acked) denominator for loss rate. Fix 5: Multiply cwnd by gain instead of dividing. Fix 6: Change beta from 0.5 to 0.7 per RFC 8312."
verification_explanation = "Tests verify RTT estimation accuracy, bandwidth magnitude, cwnd stability, loss rate precision, pacing probe behavior, and multiplicative decrease ratio across four trace scenarios."
expert_time_estimate_hours = 3.0

[task]
name = "rate-control-trace-repair"
description = "Fix 6 interacting defects in a TCP CUBIC congestion control trace replayer spanning RTT estimation, bandwidth measurement, window growth, loss detection, pacing, and multiplicative decrease."

[task.difficulty]
level = "hard"
