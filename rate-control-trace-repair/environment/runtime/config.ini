[cubic]
C = 0.4
beta = 0.7
initial_cwnd = 10
max_cwnd = 10000

[estimation]
ewma_alpha = 0.125
min_rtt_window_ms = 10000
bw_filter_len = 10

[pacing]
default_gain = 1.0
probe_gain = 1.25
drain_gain = 0.75

[detection]
loss_window_ms = 1000
timeout_multiplier = 2.0

[analysis]
active_traces = trace_alpha,trace_beta,trace_gamma,trace_delta
output_dir = /app/runtime/output
